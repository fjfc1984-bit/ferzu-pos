[build]
builder = "nixpacks"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# Evitar sleep en plan Hobby+ (en plan Starter no tiene efecto — usa UptimeRobot como fallback)
sleepApplication = false
numReplicas = 1

[[services]]
  [services.envs]
    PORT = "3001"
    NODE_ENV = "production"
